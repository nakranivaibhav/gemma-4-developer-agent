# SFT v1 for Gemma 4 E4B: same recipe as sft_e2b_v1.yaml.
# Data: runs/sft/e4b/packed.jsonl from `uv run training/sft_data.py all --student E4B --out runs/sft/e4b` (164 solved train-task traces,
# 31B 125 + E2B 39, rendered with the r08_lean_facts prompt and the 8 RL tools).
run_name: e4b_sft_v1_r64
data: runs/sft/e4b/packed.jsonl
model_dir: data/external/models/gemma-4-e4b-it-qat-w4a16-ct
output_dir: runs/sft/e4b_v1
offload_ple: true   # per-layer embedding table (5.6 GB) + audio/vision towers on CPU, see sft_train.py offload_frozen_parts
offload_activations: true   # tensors saved for backward wait in pinned CPU memory (torch.autograd.graph.save_on_cpu)

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  skip_kv_shared: true        # last 18 layers reuse earlier K/V: their k/v LoRA would get no gradient

train:
  epochs: 2
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  grad_accum: 16              # batch size is 1 packed sequence
  weight_decay: 0.0
  max_grad_norm: 1.0
  seed: 0
  logit_softcap: 30.0         # E4B final_logit_softcapping (same 30.0)

wandb:
  entity: local-research-group
  project: gemma 4
